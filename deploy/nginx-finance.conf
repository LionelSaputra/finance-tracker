# /etc/nginx/sites-available/finance  — ganti finance.example.com dengan subdomainmu.
# Setelah itu: sudo certbot --nginx -d finance.example.com  (certbot menambahkan blok HTTPS + redirect).
server {
    listen 80;
    listen [::]:80;
    server_name finance.example.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        # Host must be the public one: Next.js checks it against Origin to block cross-site form posts.
        proxy_set_header Host $host;
        # Appends the real client IP last; the app reads the right-most value for login rate limiting.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
}
